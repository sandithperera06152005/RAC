<div class="d-flex" [class.vh-100]="!isPrintRoute()">
  @if (!isSidebarHidden()) {
    <jhi-sidebar class="sidebar"></jhi-sidebar>
  }

  <div class="flex-grow-1 content-container">
    <div>
      <div [class.card]="!isPrintRoute()" [class.jh-card]="!isPrintRoute()" [class.border-0]="!isPrintRoute()">
        <router-outlet></router-outlet>
      </div>
      @if (!isPrintRoute()) {
        <jhi-footer></jhi-footer>
      }
    </div>
  </div>
</div>
